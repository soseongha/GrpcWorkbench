syntax = "proto3";

package grpcworkbench.example;

// ============================================
// 1. Unary RPC 抗力
// ============================================
service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1;
  int32 repeat_count = 2;
}

message EchoResponse {
  string result = 1;
  int32 length = 2;
}

// ============================================
// 2. Server Streaming RPC 抗力
// ============================================
service CounterService {
  rpc Countdown(CountdownRequest) returns (stream CountdownResponse);
}

message CountdownRequest {
  int32 start = 1;
  int32 step = 2;
}

message CountdownResponse {
  int32 current = 1;
  string message = 2;
}

// ============================================
// 3. Client Streaming RPC 抗力
// ============================================
service SumService {
  rpc CalculateSum(stream NumberRequest) returns (SumResponse);
}

message NumberRequest {
  int32 number = 1;
}

message SumResponse {
  int32 total = 1;
  int32 count = 2;
  double average = 3;
}

// ============================================
// 4. Bidirectional Streaming RPC 抗力
// ============================================
service ChatService {
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}

message ChatMessage {
  string user = 1;
  string text = 2;
  int64 timestamp = 3;
}
