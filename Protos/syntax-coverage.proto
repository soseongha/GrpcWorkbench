syntax = "proto3";

package demo.syntax.v1;

option csharp_namespace = "GrpcWorkbench.Protos.SyntaxCoverage";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";

service SyntaxCoverageService {
  rpc Ping (PingRequest) returns (PingReply);
  rpc Reset (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc GetStatus (StatusRequest) returns (StatusReply);
  rpc WatchEvents (WatchRequest) returns (stream Event);
  rpc UploadChunks (stream Chunk) returns (UploadSummary);
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
}

enum GlobalState {
  GLOBAL_STATE_UNSPECIFIED = 0;
  GLOBAL_STATE_READY = 1;
  GLOBAL_STATE_BUSY = 2;
  GLOBAL_STATE_ERROR = 3;
}

message PingRequest {
  string message = 1;
  optional string trace_id = 2;
  map<string, string> labels = 3;
}

message PingReply {
  string message = 1;
  google.protobuf.Timestamp server_time = 2;
}

message StatusRequest {
  string id = 1;
}

message StatusReply {
  string id = 1;
  GlobalState state = 2;
  repeated Item items = 3;
  oneof detail {
    ErrorDetail error = 4;
    NormalDetail normal = 5;
  }
}

message Item {
  string id = 1;
  ItemType type = 2;
  map<string, int64> counters = 3;

  enum ItemType {
    ITEM_TYPE_UNSPECIFIED = 0;
    ITEM_TYPE_ALPHA = 1;
    ITEM_TYPE_BETA = 2;
  }
}

message ErrorDetail {
  int32 code = 1;
  string reason = 2;
}

message NormalDetail {
  google.protobuf.StringValue display_name = 1;
  google.protobuf.Int32Value rank = 2;
  google.protobuf.Struct ext = 3;
}

message WatchRequest {
  repeated string topics = 1;
}

message Event {
  string topic = 1;
  google.protobuf.Timestamp occurred_at = 2;
  bytes payload = 3;
}

message Chunk {
  bytes data = 1;
  uint32 sequence = 2;
}

message UploadSummary {
  uint32 total_chunks = 1;
  uint64 total_bytes = 2;
}

message ChatMessage {
  string from = 1;
  string text = 2;
  google.protobuf.Timestamp sent_at = 3;

  reserved 4, 5;
  reserved "legacy_field";
}
